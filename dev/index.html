<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dev hub · Bondis.com</title>
    <style>
      :root {
        --bg: #f6f3ec;
        --surface: #ffffff;
        --ink: #1d1b18;
        --muted: #6b665e;
        --line: #e2ddd2;
        --accent: #e8452c;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15140f;
          --surface: #1f1e19;
          --ink: #f1ede4;
          --muted: #a49e92;
          --line: #34322b;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
      header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
      h1 { margin: 0; font-size: 18px; font-weight: 700; }
      h1 span { color: var(--accent); }
      .tag { font-size: 12px; color: var(--muted); }
      input {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 24px;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        outline: none;
      }
      input:focus { border-color: var(--accent); }
      h2 {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      ul { list-style: none; margin: 0 0 28px; padding: 0; }
      li a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
      }
      li a:hover, li a:focus-visible { background: var(--surface); outline: none; }
      li a:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
      kbd {
        flex: none;
        width: 22px;
        text-align: center;
        font: 12px ui-monospace, monospace;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .name { font-weight: 600; }
      .path { font: 12px ui-monospace, monospace; color: var(--muted); }
      .note { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
      .wip { color: var(--accent); }
      footer { font-size: 12px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Bondis<span>.com</span></h1>
        <span class="tag">dev hub</span>
      </header>

      <input id="filter" type="search" placeholder="Filter…  ( / to focus, Enter to open first match )" autocomplete="off" />
      <div id="lists"></div>

      <footer>Keys 1–9 open a link. Add pages in the <code>SECTIONS</code> list in <code>dev/index.html</code>.</footer>
    </main>

    <script>
      // One entry per page. `note` is optional; `wip: true` highlights it.
      const SECTIONS = [
        {
          title: 'Pages',
          links: [
            { name: 'Terminales', href: '/', note: 'Map · in progress', wip: true },
          ],
        },
        {
          title: 'Resources',
          links: [
            { name: 'GitHub repo', href: 'https://github.com/jettpistol/bondis.com' },
            { name: 'Overpass Turbo', href: 'https://overpass-turbo.eu/', note: 'Query OSM routes' },
            { name: 'OpenStreetMap', href: 'https://www.openstreetmap.org/#map=12/-34.6037/-58.3816' },
          ],
        },
      ];

      const lists = document.getElementById('lists');
      const filter = document.getElementById('filter');
      let visible = [];

      function render(q = '') {
        q = q.trim().toLowerCase();
        lists.innerHTML = '';
        visible = [];
        for (const section of SECTIONS) {
          const links = section.links.filter((l) =>
            [l.name, l.href, l.note].join(' ').toLowerCase().includes(q)
          );
          if (!links.length) continue;
          const h2 = document.createElement('h2');
          h2.textContent = section.title;
          const ul = document.createElement('ul');
          for (const l of links) {
            visible.push(l);
            const n = visible.length;
            const external = /^https?:/.test(l.href);
            const a = document.createElement('a');
            a.href = l.href;
            if (external) a.target = '_blank';
            a.innerHTML = `<kbd>${n <= 9 ? n : ''}</kbd><span class="name"></span><span class="path"></span><span class="note"></span>`;
            a.querySelector('.name').textContent = l.name;
            a.querySelector('.path').textContent = external ? new URL(l.href).host : l.href;
            const note = a.querySelector('.note');
            note.textContent = l.note || '';
            if (l.wip) note.classList.add('wip');
            const li = document.createElement('li');
            li.append(a);
            ul.append(li);
          }
          lists.append(h2, ul);
        }
      }

      function open(l) {
        if (/^https?:/.test(l.href)) window.open(l.href, '_blank');
        else location.href = l.href;
      }

      filter.addEventListener('input', () => render(filter.value));
      filter.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && visible[0]) open(visible[0]);
        if (e.key === 'Escape') { filter.value = ''; render(); filter.blur(); }
      });
      document.addEventListener('keydown', (e) => {
        if (e.target === filter || e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key === '/') { e.preventDefault(); filter.focus(); }
        const n = Number(e.key);
        if (n >= 1 && n <= 9 && visible[n - 1]) open(visible[n - 1]);
      });

      render();
    </script>
  </body>
</html>
