<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Dev hub · Bondis.com</title>
    <style>
      :root {
        --bg: #f6f3ec;
        --surface: #ffffff;
        --ink: #1d1b18;
        --muted: #6b665e;
        --line: #e2ddd2;
        --accent: #e8452c;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15140f;
          --surface: #1f1e19;
          --ink: #f1ede4;
          --muted: #a49e92;
          --line: #34322b;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 760px; margin: 0 auto; padding: 40px 16px; }
      header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: 18px; font-weight: 700; }
      h1 span { color: var(--accent); }
      .tag { font-size: 12px; color: var(--muted); }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 12px;
      }
      .card {
        display: block;
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s, transform 0.15s;
      }
      .card:hover, .card:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
      .card h2 { margin: 0 0 4px; font-size: 16px; }
      .card p { margin: 0; font-size: 13px; color: var(--muted); }
      .card .path { display: block; margin-top: 12px; font: 12px ui-monospace, monospace; color: var(--muted); }
      .wip { color: var(--accent); white-space: nowrap; }
      footer {
        margin-top: 40px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--muted);
      }
      footer a { color: inherit; }
      footer a:hover { color: var(--accent); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Bondis<span>.com</span></h1>
        <span class="tag">dev hub</span>
      </header>

      <div class="cards">
        <a class="card" href="/">
          <h2>Terminales</h2>
          <p>Map of bus terminals · <span class="wip">in progress</span></p>
          <span class="path">/</span>
        </a>
      </div>

      <footer>
        Resources:
        <a href="https://github.com/jettpistol/bondis.com" target="_blank">GitHub repo</a> ·
        <a href="https://overpass-turbo.eu/" target="_blank">Overpass Turbo</a> ·
        <a href="https://www.openstreetmap.org/#map=12/-34.6037/-58.3816" target="_blank">OpenStreetMap</a>
      </footer>
    </main>
  </body>
</html>
